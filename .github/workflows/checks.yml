name: Checks

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  checks:
    name: Backend Tests & Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Backend Unit Tests
        run: |
          python -m unittest discover -s app/_backend

      - name: Run Source Hygiene & Disclosure Gate
        run: |
          python scripts/check_source.py

      - name: Validate PowerShell Scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              Write-Host "::error file=$($_.FullName)::PowerShell parse error"
              $errors += $parseErrors
            }
          }
          if ($errors.Count -gt 0) {
            throw ($errors.Count.ToString() + ' PowerShell syntax error(s) found.')
          }
          Write-Host "All PowerShell scripts parsed cleanly."
